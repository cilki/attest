name: CI
on:
  pull_request:
    branches:
    - main
    - master
  push:
    branches:
    - main
    - master
jobs:
  rust-audit:
    runs-on: ubuntu-latest
    container: rust:latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Cache
      uses: actions/cache@v4
      with:
        key: cargo-audit-cache
        path: .cargo/
    - name: Install cargo-audit
      run: cargo install cargo-audit
    - name: Run audit
      run: cargo audit
    timeout-minutes: 10
  rust-doc:
    runs-on: ubuntu-latest
    container: rustlang/rust:nightly
    env:
      RUSTDOCFLAGS: --cfg docsrs
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Cache
      uses: actions/cache@v4
      with:
        key: rust-doc-cache
        path: |-
          target/
          .cargo/
    - name: Build docs
      run: cargo doc --no-deps --all-features
    timeout-minutes: 15
  rust-test:
    runs-on: ubuntu-latest
    container: rust:latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Cache
      uses: actions/cache@v4
      with:
        key: rust-cache
        path: |-
          target/
          .cargo/
    - name: Run tests
      run: cargo test --all-features
    timeout-minutes: 30
